name = "gamelock"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "gamelock"
# Local dev works with any value. For deploy: `wrangler d1 create gamelock`, paste the id here.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *"]

[vars]
PAYNOW_MODE = "mock"      # mock | live (live not implemented yet)
SUPPLIER = "mock"         # mock | bitrefill (bitrefill not implemented yet)
ORDER_TTL_MIN = "15"
MARKUP_PCT = "8"          # integer percent
ALLOWED_ORIGIN = ""       # site origin allowed to call this API, e.g. "https://<user>.github.io"
